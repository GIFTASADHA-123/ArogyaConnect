<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ArogyaConnect - Patient Monitoring System"
    >

    <meta
        name="theme-color"
        content="#0f766e"
    >

    <title>
        ArogyaConnect | Patient Monitoring
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f9f9;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

            color: #123333;
        }

        .loading-container {

            width: 100%;

            max-width: 500px;

            padding: 40px 24px;

            text-align: center;
        }

        .logo {

            width: 82px;

            height: 82px;

            margin: 0 auto 24px;

            border-radius: 22px;

            background: linear-gradient(
                135deg,
                #0f766e,
                #14b8a6
            );

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 42px;

            font-weight: 800;

            box-shadow:
                0 14px 35px
                rgba(15, 118, 110, 0.20);
        }

        h1 {

            margin: 0;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -0.5px;
        }

        p {

            margin: 10px 0 0;

            color: #668080;

            font-size: 15px;
        }

        .loader {

            width: 38px;

            height: 38px;

            margin: 28px auto 0;

            border: 4px solid #d7e9e7;

            border-top-color: #0f766e;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        .fallback {

            margin-top: 24px;

            font-size: 13px;

            color: #789090;
        }

        .fallback a {

            color: #0f766e;

            font-weight: 700;

            text-decoration: none;
        }

        .fallback a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


    <main class="loading-container">

        <div class="logo">
            A
        </div>


        <h1>
            ArogyaConnect
        </h1>


        <p>
            Patient Monitoring &amp; Care System
        </p>


        <div
            class="loader"
            aria-label="Loading"
        ></div>


        <div class="fallback">

            Redirecting to secure login...

            <br>

            <a href="pages/login.html">
                Continue to Login
            </a>

        </div>

    </main>


    <script>

        /*
         * ArogyaConnect Entry Point
         *
         * index.html is located at:
         *
         * frontend/index.html
         *
         * Login page is located at:
         *
         * frontend/pages/login.html
         */

        window.setTimeout(function () {

            window.location.href =
                "pages/login.html";

        }, 700);

    </script>


</body>

</html>
